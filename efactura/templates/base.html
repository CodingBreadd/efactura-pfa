<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>e-Factura PFA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5f8b'/%3E%3Ctext x='32' y='48' font-size='52' font-family='Segoe UI,Arial,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3Ee%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e3e3de;
          --accent:#1f5f8b; --ok:#2e7d4f; --bad:#b3261e; --warn:#8a6d00; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 24px;
           display:flex; gap:20px; align-items:center; }
  header b { font-size:17px; margin-right:auto; }
  header a { color:var(--ink); text-decoration:none; }
  main { max-width:960px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px; margin-bottom:16px; }
  h1 { font-size:22px; margin:0 0 16px; } h2 { font-size:16px; margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--muted); font-size:13px; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:10px; }
  input, select, textarea { display:block; width:100%; padding:7px 9px; font:inherit; color:var(--ink);
           border:1px solid var(--line); border-radius:6px; background:#fff; margin-top:3px; }
  label.check { display:flex; gap:8px; align-items:center; color:var(--ink); }
  label.check input { width:auto; margin:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:0 16px; }
  .btn { display:inline-block; padding:8px 14px; border-radius:6px; border:1px solid var(--accent);
         background:var(--accent); color:#fff; font:inherit; text-decoration:none; cursor:pointer; }
  .btn.ghost { background:transparent; color:var(--accent); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid currentColor; }
  .valid { color:var(--ok); } .invalid { color:var(--bad); } .draft { color:var(--warn); } .sent { color:var(--accent); }
  .muted { color:var(--muted); } .hint { font-size:13px; color:var(--muted); }
  ul.msgs { margin:0; padding-left:18px; color:var(--bad); }
  @media (max-width:640px) { header { padding:12px 16px; flex-wrap:wrap; } }
</style>
</head>
<body>
<header>
  <b>e-Factura PFA <span class="hint" style="font-weight:400">v{{ version }}</span></b>
  <a href="/">Facturi</a>
  <a href="/factura/noua">Factură nouă</a>
  <a href="/setari">Setări</a>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
